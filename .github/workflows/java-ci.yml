
name: Java Socket Chat CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java files
        run: javac Server.java Client.java ChatIntegrationTest.java

      - name: Run chat integration test
        run: timeout 15s java ChatIntegrationTest
